services:
  - type: web
    name: ai-auditor
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: AUDITOR_ENV
        value: production
      - key: AUDITOR_LOCAL_AUTH
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: audit-evidence
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_ZDR_CONFIRMED
        sync: false
      - key: MAX_UPLOAD_MB
        value: "12"
