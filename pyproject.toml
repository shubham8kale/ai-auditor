[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-auditor"
version = "0.1.0"
description = "Evidence-led audit preparation and review workspace"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1", "openpyxl>=3.1.5,<4", "defusedxml>=0.7.1,<1", "pypdf>=6,<7",
  "pypdfium2>=4.30,<6", "pillow>=11,<13", "reportlab>=4.3,<5"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["auditor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
