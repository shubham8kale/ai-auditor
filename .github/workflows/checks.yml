name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create isolated Python environment
        run: python -m venv .venv
      - name: Install pinned runtime and test tools
        run: .venv/bin/python -m pip install -r requirements.txt -e '.[dev]'
      - name: Check backend
        run: |
          .venv/bin/python -m ruff check auditor tests scripts
          .venv/bin/python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
